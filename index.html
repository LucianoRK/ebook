<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>book</title>

  <style>
    html,
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* fundo com imagem */
      background: url('./image/fundo.png') center / cover no-repeat fixed;
      font-family: sans-serif;
    }

    @media (max-width: 900px) {
      body {
        background-attachment: scroll;
      }
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    #flipbook {
      width: 1500px;
      height: 850px;
      position: relative;
    }

    .page {
      width: 100%;
      height: 100%;
    }

    /* imagens ocupando toda página */
    .page img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Página transparente com borda e sombra suave */
    .page {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      /* mantém transparente */
      overflow: visible;
      /* deixa a sombra aparecer */
      border-radius: 10px;
      /* opcional: cantos arredondados */
    }

    /* sombra externa suave */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      /* cobre toda a página */
      border-radius: inherit;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, .18),
        0 3px 10px rgba(0, 0, 0, .12);
      pointer-events: none;
      /* não bloqueia cliques/viradas */
      z-index: 1;
    }

    /* linha de borda sutil por cima da imagem */
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 5px solid rgba(0, 0, 0, .12);
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 1700px) {
      #flipbook {
        width: 90vw;
        height: calc(90vw * 0.625);
      }
    }

    /* -------- Modal de vídeo -------- */
    .video-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .video-modal.open {
      display: flex;
    }

    .video-modal__content {
      position: relative;
      /* maior, respeitando viewport: limita por largura, altura e um teto de 1800px */
      width: min(98vw, calc(98vh * (16/9)), 1800px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    .video-modal__content iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-modal__close {
      position: absolute;
      top: 8px;
      right: 12px;
      font: 700 22px/1 sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, .45);
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* -------- Hotspot do play -------- */
    .hotspot-play {
      position: absolute;
      /* Ajuste fino: porcentagens para ficar sobre o play da arte */
      left: 60%;
      top: 72%;
      width: 22%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      border: 0;
      background: transparent;
      z-index: 5;
      /* acima da imagem da página */
      pointer-events: auto;
      /* garante captação do clique */
    }

    .hotspot-play:focus-visible {
      box-shadow: 0 0 0 3px rgba(0, 165, 255, .75);
      border-radius: 50%;
    }
  </style>

  <!-- jQuery compatível -->
  <script src="js/jquery-1.11.3.min.js"></script>
  <!-- Turn.js -->
  <script src="js/turn.min.js"></script>
</head>

<body>

  <div id="flipbook">
    <!-- CAPA -->
    <div class="page hard">
      <img src="./image/1.jpg" alt="Página 1">
    </div>

    <!-- PÁGINAS -->
    <div class="page"><img src="./image/2.jpg" alt="Página 2"></div>
    <div class="page"><img src="./image/3.jpg" alt="Página 3"></div>
    <div class="page"><img src="./image/4.jpg" alt="Página 4"></div>
    <div class="page">
      <img src="./image/5.jpg" alt="Página 5">
      <button class="hotspot-play" aria-label="Assistir ao vídeo"
        data-video="https://scratch.mit.edu/projects/1212995699/embed" style="left: 12%; top: 75%; width: 18%;">
      </button>
    </div>
    <div class="page">
      <img src="./image/6.jpg" alt="Página 6">
      <button class="hotspot-play" aria-label="Assistir ao vídeo"
        data-video="https://scratch.mit.edu/projects/1212868708/embed" style="left: 64%; top: 75%; width: 18%;">
      </button>
    </div>
    <div class="page"><img src="./image/7.jpg" alt="Página 7"><a href="sss">aaaa</a></div>

    <div class="page">
      <img src="./image/8.jpg" alt="Página 8">
      <button class="hotspot-play" aria-label="Assistir ao vídeo" data-video="https://www.youtube.com/embed/KiDXiaN6Q1Y"
        style="left: 58%; top: 70%; width: 22%;"></button>
    </div>

    <div class="page"><img src="./image/9.jpg" alt="Página 9"></div>
    <div class="page"><img src="./image/10.jpg" alt="Página 10"></div>
    <div class="page"><img src="./image/11.jpg" alt="Página 11"></div>
    <div class="page"><img src="./image/12.jpg" alt="Página 12"></div>
    <div class="page"><img src="./image/13.jpg" alt="Página 13"></div>
    <div class="page"><img src="./image/14.jpg" alt="Página 14"></div>

    <div class="page">
      <img src="./image/15.jpg" alt="Página 15">
      <button class="hotspot-play" aria-label="Assistir ao vídeo (página 15)"
        data-video="https://www.youtube.com/embed/s8DmKUQ-m2E" style="left: 42%; top: 73%; width: 22%;">
      </button>
      <button class="hotspot-play" aria-label="jogar (página 15)"
        data-video="https://scratch.mit.edu/projects/1212987185/embed" style="left: 70%; top: 75%; width: 18%;">
      </button>
    </div>

    <div class="page"><img src="./image/16.jpg" alt="Página 16"></div>
    <div class="page"><img src="./image/17.jpg" alt="Página 17"></div>
    <div class="page"><img src="./image/18.jpg" alt="Página 18"></div>
    <div class="page"><img src="./image/default.jpg" alt="Página default"></div>

    <!-- CONTRA-CAPA -->
    <div class="page hard">
      <img src="./image/19.jpg" alt="Página 19">
    </div>
  </div>

  <audio id="flip-sound" src="audio/page-flip.mp3" preload="auto" playsinline></audio>

  <!-- Modal de vídeo YouTube -->
  <div class="video-modal" id="videoModal" aria-hidden="true" role="dialog">
    <div class="video-modal__content" role="document">
      <button class="video-modal__close" type="button" aria-label="Fechar">✕</button>
      <iframe id="videoFrame" src="" title="YouTube video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>
  </div>

  <script>
    jQuery(function ($) {
      var $book = $('#flipbook');
      var flipSound = document.getElementById('flip-sound');

      var audioUnlocked = false;

      function unlockAudioOnce() {
        if (audioUnlocked) return;
        flipSound.muted = true;
        flipSound.play().then(function () {
          flipSound.pause();
          flipSound.currentTime = 0;
          flipSound.muted = false;
          audioUnlocked = true;
        }).catch(function () { /* ignora */ });
        // Remove os listeners depois da primeira tentativa
        window.removeEventListener('click', unlockAudioOnce);
        window.removeEventListener('keydown', unlockAudioOnce);
        window.removeEventListener('touchstart', unlockAudioOnce, { passive: true });
        window.removeEventListener('pointerdown', unlockAudioOnce);
      }

      // Desbloqueia áudio na primeira interação (desktop e mobile)
      window.addEventListener('click', unlockAudioOnce);
      window.addEventListener('keydown', unlockAudioOnce);
      window.addEventListener('touchstart', unlockAudioOnce, { passive: true });
      window.addEventListener('pointerdown', unlockAudioOnce);

      $book.turn({
        width: $book.width(),
        height: $book.height(),
        display: (window.innerWidth < 700) ? 'single' : 'double',
        autoCenter: true,
        gradients: true,
        acceleration: true,
        when: {
          turning: function () {
            // Só toca se já houve interação do usuário
            if (!audioUnlocked) return;
            flipSound.currentTime = 0;
            flipSound.play().catch(function () { /* evita erro no console */ });
          }
        }
      });

      // Clique para virar 
      $book.on('click', function (e) {
        if ($(e.target).closest('.hotspot-play').length) return;
        var pos = e.pageX - $book.offset().left;
        if (pos < $book.width() / 2) $book.turn('previous');
        else $book.turn('next');
      });

      // Teclado ← →
      $(document).on('keydown', function (e) {
        if (e.key === "ArrowLeft") $book.turn('previous');
        if (e.key === "ArrowRight") $book.turn('next');
      });

      // Ajuste no resize
      window.addEventListener('resize', function () {
        $book.turn('display', (window.innerWidth < 700) ? 'single' : 'double');
        $book.turn('size', $book.width(), $book.height());
      });

      /* ------- Modal de vídeo ------- */
      var $modal = $('#videoModal');
      var $iframe = $('#videoFrame');

      function openVideoModal(videoUrl) {
        // garante autoplay e remove params repetidos
        var url = new URL(videoUrl, window.location.href);
        if (!url.searchParams.has('autoplay')) url.searchParams.set('autoplay', '1');
        if (!url.searchParams.has('rel')) url.searchParams.set('rel', '0');

        $iframe.attr('src', url.toString());
        $modal.addClass('open').attr('aria-hidden', 'false');
        // pausa som de virada enquanto o vídeo toca
        flipSound.pause();
      }

      function closeVideoModal() {
        $modal.removeClass('open').attr('aria-hidden', 'true');
        $iframe.attr('src', '');
      }

      // Bloqueia virar página por eventos de down/up em qualquer dispositivo
      $(document).on('pointerdown pointerup touchstart touchend mousedown mouseup', '.hotspot-play', function (e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return false;
      });

      // Clique no hotspot: abre modal e NÃO vira página
      $(document).on('click', '.hotspot-play', function (e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        var videoUrl = $(this).data('video');
        if (videoUrl) openVideoModal(videoUrl);
        return false;
      });

      // Fechar clicando fora do vídeo
      $modal.on('click', function (e) {
        if (e.target === this) closeVideoModal();
      });

      // Botão fechar
      $modal.find('.video-modal__close').on('click', function (e) {
        e.stopPropagation();
        closeVideoModal();
      });

      // Esc fecha
      $(document).on('keydown', function (e) {
        if (e.key === 'Escape' && $modal.hasClass('open')) {
          closeVideoModal();
        }
      });

      // Se a página virar, fecha a modal (evita vídeo tocando por trás)
      $book.bind('turning', function () {
        if ($modal.hasClass('open')) closeVideoModal();
      });
    });
  </script>

</body>

</html>
