<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>book</title>

  <style>
    html,
    body {
      display: flex;
      align-items: center;
      justify-content: center;

      /* fundo com imagem */
      background: url('./image/fundo.png') center / cover no-repeat fixed;
      font-family: sans-serif;
    }

    @media (max-width: 900px) {
      body {
        background-attachment: scroll;
      }
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    #flipbook {
      width: 1500px;
      height: 850px;
    }


    .page {
      width: 100%;
      height: 100%;
    }

    /* imagens ocupando toda página */
    .page img {
      width: 100%;
      height: 100%;
    }

    /* Página transparente com borda e sombra suave */
    .page {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      /* mantém transparente */
      overflow: visible;
      /* deixa a sombra aparecer */
      border-radius: 10px;
      /* opcional: cantos arredondados */
    }

    /* sombra externa suave */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      /* cobre toda a página */
      border-radius: inherit;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, .18),
        0 3px 10px rgba(0, 0, 0, .12);
      pointer-events: none;
      /* não bloqueia cliques/viradas */
      z-index: 1;
    }

    /* linha de borda sutil por cima da imagem */
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 5px solid rgba(0, 0, 0, .12);
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 1700px) {
      #flipbook {
        width: 90vw;
        height: calc(90vw * 0.625);
      }
    }
  </style>

  <!-- jQuery compatível -->
  <script src="js/jquery-1.11.3.min.js"></script>
  <!-- Turn.js -->
  <script src="js/turn.min.js"></script>
</head>

<body>

  <div id="flipbook">
    <!-- CAPA -->
    <div class="page hard">
      <img src="./image/1.jpg" alt="Página 1">
    </div>

    <!-- PÁGINAS -->
    <div class="page"><img src="./image/2.jpg" alt="Página 2"></div>
    <div class="page"><img src="./image/3.jpg" alt="Página 3"></div>
    <div class="page"><img src="./image/4.jpg" alt="Página 4"></div>
    <div class="page"><img src="./image/5.jpg" alt="Página 5"></div>
    <div class="page"><img src="./image/6.jpg" alt="Página 6"></div>
    <div class="page"><img src="./image/7.jpg" alt="Página 7"></div>
    <div class="page"><img src="./image/8.jpg" alt="Página 8"></div>
    <div class="page"><img src="./image/9.jpg" alt="Página 9"></div>
    <div class="page"><img src="./image/10.jpg" alt="Página 10"></div>
    <div class="page"><img src="./image/11.jpg" alt="Página 11"></div>
    <div class="page"><img src="./image/12.jpg" alt="Página 12"></div>
    <div class="page"><img src="./image/13.jpg" alt="Página 13"></div>
    <div class="page"><img src="./image/14.jpg" alt="Página 14"></div>
    <div class="page"><img src="./image/15.jpg" alt="Página 15"></div>

    <!-- CONTRA-CAPA -->
    <div class="page hard">
      <img src="./image/16.jpg" alt="Página 16">
    </div>
  </div>

  <audio id="flip-sound" src="audio/page-flip.mp3" preload="auto"></audio>

  <script>
    jQuery(function ($) {
      var $book = $('#flipbook');
      var flipSound = document.getElementById('flip-sound');

      $book.turn({
        width: $book.width(),
        height: $book.height(),
        display: (window.innerWidth < 700) ? 'single' : 'double',
        autoCenter: true,
        gradients: true,
        acceleration: true,

        when: {
          turning: function () {
            flipSound.currentTime = 0; // reinicia o som caso vire rápido
            flipSound.play();
          }
        }
      });

      // Clique para virar0
      $book.on('click', function (e) {
        var pos = e.pageX - $book.offset().left;
        if (pos < $book.width() / 2) $book.turn('previous');
        else $book.turn('next');
      });

      // Teclado ← →
      $(document).on('keydown', function (e) {
        if (e.key === "ArrowLeft") $book.turn('previous');
        if (e.key === "ArrowRight") $book.turn('next');
      });

      // Ajuste no resize
      window.addEventListener('resize', function () {
        $book.turn('display', (window.innerWidth < 700) ? 'single' : 'double');
        $book.turn('size', $book.width(), $book.height());
      });
    });
  </script>

</body>

</html>
