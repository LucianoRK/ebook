<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ebook – com iframe nos quadrantes</title>
  <style>
    :root {
      --bg: #0f172a;
      --muted: #94a3b8;
      --card: #111827;
      --radius: 18px;
      --shadow: 0 16px 50px rgba(0, 0, 0, .45);
      --overlay-gap: 12px; /* margem do iframe para as bordas */
    }

    * { box-sizing: border-box }

    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(1200px 1200px at 80% -10%, #1e293b, transparent), var(--bg);
      color: #e2e8f0;
      font: 500 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,"Helvetica Neue",Arial
    }

    header { padding: 34px 18px 12px; text-align: center }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(22px, 3.4vw, 44px);
      letter-spacing: .3px
    }

    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px 80px
    }

    .card {
      width: min(1180px, 96vw);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: calc(var(--radius) + 4px);
      padding: 20px 20px 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      margin: 0 auto
    }

    .viewer {
      width: min(1100px, 92vw);
      aspect-ratio: 3/2;
      background: #0b1220;
      border-radius: var(--radius);
      position: relative;
      margin: 0 auto 14px;
      overflow: hidden; /* mantém a imagem “presa” ao contêiner */
    }

    .viewer img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* iframe sobreposto – não corta e tem margem */
    .overlay-iframe {
      position: absolute;
      /* largura ocupa metade do viewer, descontando margem dos dois lados */
      width: calc(50% - (var(--overlay-gap) * 2));
      /* mantém a proporção do embed do Scratch (485x402) */
      aspect-ratio: 485 / 402;
      height: auto;                 /* deixa o browser calcular a altura pela proporção */
      max-height: calc(50% - (var(--overlay-gap) * 2)); /* nunca maior que metade em altura */
      border: none;
      border-radius: 12px;
      z-index: 2;
      display: none;                /* só mostra nas páginas desejadas */
      background: #0b1220;         /* fallback suave durante o carregamento */
    }

    /* Primeiro quadrante (top-left) com margem */
    .quadrante-1 { top: var(--overlay-gap); left: var(--overlay-gap); }

    /* Terceiro quadrante (bottom-left) com margem */
    .quadrante-3 { bottom: var(--overlay-gap); left: var(--overlay-gap); }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px
    }

    .btn {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: 700;
      letter-spacing: .2px;
      cursor: pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
      white-space: nowrap
    }

    .btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2) }
    .btn:active { transform: translateY(1px) }
    .btn[disabled] { opacity: .45; cursor: not-allowed }

    .counter { color: var(--muted); font-size: 13px; min-width: 120px; text-align: center }
  </style>
</head>

<body>
  <header>
    <h1>Ebook mozinho</h1>
  </header>

  <div class="wrap">
    <section class="card">
      <div class="viewer" id="viewer">
        <img id="page" alt="Página" loading="eager" />

        <!-- iframe sobreposto -->
        <iframe
          id="iframeOverlay"
          src="https://scratch.mit.edu/projects/1190046255/embed"
          class="overlay-iframe"
          allowtransparency="true"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>
      <div class="controls">
        <button class="btn prev" type="button">◀ Voltar</button>
        <span class="counter"></span>
        <button class="btn next" type="button">Avançar ▶</button>
      </div>
    </section>
  </div>

  <script>
    const IMAGENS = ['1.jpg','2.jpg','3.jpg','4.jpg'];

    const img = document.getElementById('page');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const counter = document.querySelector('.counter');
    const iframe = document.getElementById('iframeOverlay');

    // pré-carrega as imagens
    IMAGENS.forEach(src => { const i = new Image(); i.src = src; });

    let index = 0;

    function render() {
      img.src = IMAGENS[index];
      counter.textContent = `Página ${index + 1} de ${IMAGENS.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === IMAGENS.length - 1;

      // controla exibição e posição do iframe
      iframe.style.display = "none";
      iframe.classList.remove('quadrante-1', 'quadrante-3');

      if (index === 1) {             // segunda imagem
        iframe.style.display = "block";
        iframe.classList.add('quadrante-1');
      } else if (index === IMAGENS.length - 1) { // última imagem
        iframe.style.display = "block";
        iframe.classList.add('quadrante-3');
      }
    }

    function next() { if (index < IMAGENS.length - 1) { index++; render(); } }
    function prev() { if (index > 0) { index--; render(); } }

    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    render();
  </script>
</body>
</html>
