<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ebook</title>
  <style>
    :root {
      --bg: #0f172a;
      --muted: #94a3b8;
      --card: #111827;
      --radius: 18px;
      --shadow: 0 16px 50px rgba(0, 0, 0, .45);
      --overlay-gap: 12px;
      --flip-duration: 1200ms;
    }

    * { box-sizing: border-box }

    body {
      margin: 0;
      min-height: 100dvh;
      background: url('fundo.png') center / cover no-repeat fixed, var(--bg);
      color: #e2e8f0;
      font: 500 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,"Helvetica Neue",Arial
    }

    header { padding: 12px 18px; text-align: center }

    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 28px
    }

    .card {
      background: #4a1d0a;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: calc(var(--radius) + 4px);
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      margin: 0 auto
    }

    .viewer {
      width: min(1100px, 92vw);
      aspect-ratio: 1 / 1; /* fallback */
      background: #0b1220;
      border-radius: var(--radius);
      position: relative;
      margin: 0 auto 14px;
      overflow: hidden;
      perspective: 900px;
    }

    .viewer img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* mostra a imagem inteira, sem corte */
      display: block;
      border-radius: var(--radius);
      z-index: 0;
      background: #0b1220; /* cor de fundo nas bordas (letterbox) */
    }

    /* Overlays configuráveis (criados dinamicamente) */
    .overlay-iframe {
      position: absolute;
      border: none;
      border-radius: 12px;
      z-index: 2;
      display: none; /* vira block quando a página corresponder */
      background: #0b1220;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px
    }

    .btn {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: 700;
      letter-spacing: .2px;
      cursor: pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
      white-space: nowrap
    }

    .btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2) }
    .btn:active { transform: translateY(1px) }
    .btn[disabled] { opacity: .45; cursor: not-allowed }

    .counter { color: var(--muted); font-size: 13px; min-width: 120px; text-align: center }

    /* ===== Flip base ===== */
    .flip { position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: var(--radius); overflow: hidden; }
    .sheet, .side { transform: translateZ(0); will-change: transform, opacity; }
    .sheet { position: absolute; inset: 0; transform-style: preserve-3d; border-radius: var(--radius); }
    .side { position: absolute; inset: 0; border-radius: var(--radius); background-size: contain; background-repeat: no-repeat; background-position: center; backface-visibility: hidden; }
    .flip .side.back { transform: rotateY(180deg); }
    .side::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }

    .flip.next .sheet { transform-origin: left bottom; animation: turn-left-corner-next var(--flip-duration) ease-in-out forwards; }
    .flip.next .side.front::after { background: radial-gradient(140% 140% at 0% 100%, rgba(0,0,0,.45), rgba(0,0,0,0) 60%); animation: shade-left-corner var(--flip-duration) ease-in-out forwards; }

    .flip.prev .sheet { transform-origin: left bottom; animation: turn-left-corner-prev var(--flip-duration) ease-in-out forwards; }
    .flip.prev .side.front::after { background: radial-gradient(140% 140% at 0% 100%, rgba(0,0,0,.45), rgba(0,0,0,0) 60%); animation: shade-left-corner-prev var(--flip-duration) ease-in-out forwards; }

    @keyframes turn-left-corner-next {
      0% { transform: rotateY(0deg) rotateZ(0deg); box-shadow: 0 40px 80px rgba(0,0,0,.35); opacity: 1; }
      35%{ transform: rotateY(-70deg) rotateZ(-5deg); box-shadow: 0 50px 100px rgba(0,0,0,.45); }
      65%{ transform: rotateY(-130deg) rotateZ(-9deg); box-shadow: 0 60px 120px rgba(0,0,0,.50); }
      92%{ transform: rotateY(-178deg) rotateZ(-9deg); box-shadow: 0 40px 80px rgba(0,0,0,.30); }
      100%{ transform: rotateY(-180deg) rotateZ(0deg); box-shadow: none; opacity: 0; }
    }
    @keyframes shade-left-corner { 0%{opacity:.0} 30%{opacity:.6} 70%{opacity:.35} 100%{opacity:.0} }

    @keyframes turn-left-corner-prev {
      0% { transform: rotateY(-180deg) rotateZ(0deg); box-shadow: none; opacity: 0.0; }
      8% { box-shadow: 0 40px 80px rgba(0,0,0,.30); opacity: 1.0; }
      35%{ transform: rotateY(-130deg) rotateZ(-9deg); box-shadow: 0 60px 120px rgba(0,0,0,.50); }
      65%{ transform: rotateY(-70deg)  rotateZ(-5deg); box-shadow: 0 50px 100px rgba(0,0,0,.45); }
      100%{ transform: rotateY(0deg)    rotateZ(0deg);  box-shadow: 0 40px 80px rgba(0,0,0,.35); opacity: 1.0; }
    }
    @keyframes shade-left-corner-prev { 0%{opacity:.0} 30%{opacity:.35} 70%{opacity:.6} 100%{opacity:.0} }

    @media (prefers-reduced-motion: reduce) {
      .flip .sheet { animation: none !important; }
      .side::after { display: none !important; }
    }

    @media (max-width: 480px) {
      header { padding: 8px 10px; }
      .wrap { padding: 12px 10px 18px; }
      .card { padding: 12px; }
      .btn { padding: 8px 12px; border-radius: 12px; font-weight: 600; }
      .counter { font-size: 12px; }
    }

    /* ===== Modal tela cheia ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 1000; display: none; }
    .modal-overlay.open { display: block; }
    .modal-inner { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; padding: 12px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px; }
    .modal-title { font-weight: 700; color: #e2e8f0; }
    .modal-nav { display: none; align-items: center; gap: 8px; }
    .modal-count { color: var(--muted); font-size: 13px; }
    .modal-body { position: relative; margin-top: 10px; }
    .modal-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; border-radius: 12px; background: #0b1220; }
  </style>
</head>

<body>
  <header></header>

  <div class="wrap">
    <section class="card">
      <div class="viewer" id="viewer">
        <img id="page" alt="Página" loading="eager" />
        <!-- iframes de overlay serão criados dinamicamente aqui -->
      </div>
      <div class="controls">
        <button class="btn prev" type="button">◀ Voltar</button>
        <span class="counter"></span>
        <button class="btn next" type="button">Avançar ▶</button>
        <button class="btn open-full" type="button" title="Abrir conteúdo em tela cheia" style="display:none">Jogar</button>
      </div>
    </section>
  </div>

  <!-- Modal fullscreen -->
  <div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal-inner" role="dialog" aria-modal="true" aria-label="Conteúdo interativo em tela cheia">
      <div class="modal-header">
        <div class="modal-title"></div>
        <div class="modal-nav" id="modalNav">
          <button class="btn modal-prev" type="button" aria-label="Anterior">◀</button>
          <span class="modal-count" id="modalCounter">1/1</span>
          <button class="btn modal-next" type="button" aria-label="Próximo">▶</button>
        </div>
        <button class="btn modal-close" id="modalClose" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <iframe id="modalIframe" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>
  </div>

  <script>
    // ====== CONFIGURAÇÃO DOS IFRAMES (percentuais do tamanho do viewer) ======
    // posicaoX/posicaoY/largura/altura: número = % (0–100) ou string com unidade (ex: '320px', '45%')
    const IFRAMES = [
      { pagina: 3, posicaoX: 32, posicaoY: 45, largura: 61, altura: 50, link: 'https://scratch.mit.edu/projects/1212995699/embed' },
      { pagina: 4, posicaoX: 4,  posicaoY: 52, largura: 53, altura: 44, link: 'https://scratch.mit.edu/projects/1212868708/embed' },
      { pagina: 5, posicaoX: 33, posicaoY: 49, largura: 60, altura: 49, link: 'https://scratch.mit.edu/projects/1212987185/embed' }
    ];

    const IMAGENS = ['1.png','2.png','3.png','4.png','5.png','6.png'];

    const img = document.getElementById('page');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const openFullBtn = document.querySelector('.open-full');
    const counter = document.querySelector('.counter');
    const viewer = document.getElementById('viewer');

    // Modal refs
    const modal = document.getElementById('modal');
    const modalIframe = document.getElementById('modalIframe');
    const modalClose = document.getElementById('modalClose');
    const modalPrev = document.querySelector('.modal-prev');
    const modalNext = document.querySelector('.modal-next');
    const modalNav = document.getElementById('modalNav');
    const modalCounter = document.getElementById('modalCounter');

    // pré-carrega imagens
    IMAGENS.forEach(src => { const i = new Image(); i.src = src; });

    let index = 0;
    let flipping = false;
    let userActivated = false; // só liberamos mídia após gesto do usuário

    // --- Som de virada de página ---
    const flipAudio = new Audio('page-flip.mp3');
    flipAudio.preload = 'auto';
    // flipAudio.volume = 1; // ajuste o volume aqui (0.0 a 1.0)

    function playFlip() {
      if (!userActivated) return; // respeita a política de gesto do navegador
      try { flipAudio.currentTime = 0; flipAudio.play().catch(() => {}); } catch (_) {}
    }

    function toCssUnit(v, unit = '%') {
      if (typeof v === 'string') return v;
      if (typeof v === 'number') return v + unit;
      return '0' + unit;
    }

    function applyIframeVisibility(visible) {
      viewer.querySelectorAll('.overlay-iframe').forEach(el => { el.style.visibility = visible ? 'visible' : 'hidden'; });
    }

    function clearOverlays() { viewer.querySelectorAll('.overlay-iframe').forEach(el => el.remove()); }

    function addOverlaysForPage(pageNumber) {
      const configs = IFRAMES.filter(item => item.pagina === pageNumber);
      configs.forEach((cfg, i) => {
        const f = document.createElement('iframe');
        f.className = 'overlay-iframe';
        f.title = `Conteúdo interativo ${i+1}`;
        f.allowFullscreen = true;
        f.setAttribute('frameborder', '0');
        f.setAttribute('allowtransparency', 'true');
        f.setAttribute('loading', 'lazy');
        f.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media');
        f.style.left = toCssUnit(cfg.posicaoX);
        f.style.top = toCssUnit(cfg.posicaoY);
        f.style.width = toCssUnit(cfg.largura);
        f.style.height = toCssUnit(cfg.altura);
        if (userActivated) { f.src = cfg.link; } else { f.dataset.src = cfg.link; }
        f.style.display = 'block';
        viewer.appendChild(f);
      });
    }

    // Calcula o maior tamanho quadrado que cabe tanto na largura quanto na altura disponíveis
    function resizeViewer() {
      const header = document.querySelector('header');
      const controls = document.querySelector('.controls');
      const card = document.querySelector('.card');
      const wrap = document.querySelector('.wrap');

      const vw = Math.min(1100, window.innerWidth * 0.92);
      const wrapStyles = getComputedStyle(wrap);
      const wrapPad = parseFloat(wrapStyles.paddingTop) + parseFloat(wrapStyles.paddingBottom);
      const cardStyles = getComputedStyle(card);
      const cardPad = parseFloat(cardStyles.paddingTop) + parseFloat(cardStyles.paddingBottom);
      const safety = 40; // folga para bordas/margens
      const availableH = window.innerHeight - header.offsetHeight - controls.offsetHeight - wrapPad - cardPad - safety;
      const side = Math.max(220, Math.min(vw, availableH));
      viewer.style.width = side + 'px';
      viewer.style.height = side + 'px';
    }

    function updateFullscreenBtn() {
      const count = IFRAMES.filter(item => item.pagina === (index + 1)).length;
      if (count > 0) {
        openFullBtn.style.display = 'inline-block';
        openFullBtn.disabled = false;
      } else {
        openFullBtn.style.display = 'none';
        openFullBtn.disabled = true;
      }
    }

    function render() {
      img.src = IMAGENS[index];
      counter.textContent = `Página ${index + 1} de ${IMAGENS.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === IMAGENS.length - 1;
      clearOverlays();
      addOverlaysForPage(index + 1);
      applyIframeVisibility(true);
      updateFullscreenBtn();
    }

    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function createFlip(currentSrc, targetSrc, direction) {
      const flip = document.createElement('div');
      flip.className = `flip ${direction}`;
      const sheet = document.createElement('div'); sheet.className = 'sheet';
      const front = document.createElement('div'); front.className = 'side front';
      const back = document.createElement('div'); back.className = 'side back';
      if (direction === 'prev') { back.style.backgroundImage = `url("${currentSrc}")`; front.style.backgroundImage = `url("${targetSrc}")`; }
      else { front.style.backgroundImage = `url("${currentSrc}")`; back.style.backgroundImage = `url("${targetSrc}")`; }
      sheet.appendChild(front); sheet.appendChild(back); flip.appendChild(sheet); return flip;
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      modalIframe.src = '';
    }

    function flipTo(newIndex, dir) {
      if (flipping) return;
      if (newIndex < 0 || newIndex > IMAGENS.length - 1) return;

      // fecha modal se estiver aberto antes de virar
      if (modal.classList.contains('open')) closeModal();

      // toca o som de virar página no início da animação
      playFlip();

      if (prefersReduced) { index = newIndex; render(); return; }

      flipping = true;
      const currentSrc = IMAGENS[index];
      const targetSrc  = IMAGENS[newIndex];
      applyIframeVisibility(false);
      const flip = createFlip(currentSrc, targetSrc, dir);
      viewer.appendChild(flip);
      if (dir === 'next') { index = newIndex; render(); }
      const done = () => { flip.removeEventListener('animationend', done); flip.remove(); if (dir === 'prev') { index = newIndex; render(); } flipping = false; applyIframeVisibility(true); };
      flip.addEventListener('animationend', done);
    }

    function next() { if (index < IMAGENS.length - 1) flipTo(index + 1, 'next'); }
    function prev() { if (index > 0) flipTo(index - 1, 'prev'); }

    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);

    // Qualquer gesto do usuário ativa a mídia (carrega SRCs dos iframes e desbloqueia o áudio)
    function onUserGesture() {
      if (userActivated) return; userActivated = true;
      try { flipAudio.muted = true; flipAudio.play().then(() => { flipAudio.pause(); flipAudio.currentTime = 0; flipAudio.muted = false; }).catch(() => { flipAudio.muted = false; }); } catch (_) { flipAudio.muted = false; }
      viewer.querySelectorAll('.overlay-iframe').forEach(f => { if (!f.src && f.dataset.src) f.src = f.dataset.src; });
    }
    window.addEventListener('pointerdown', onUserGesture, { once: true, capture: true });
    window.addEventListener('keydown', onUserGesture, { once: true, capture: true });

    // Navegação por teclas
    window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev(); if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

    // clique nos lados do viewer
    viewer.addEventListener('click', (e) => { const rect = viewer.getBoundingClientRect(); const x = e.clientX - rect.left; if (x > rect.width * 0.6) next(); else if (x < rect.width * 0.4) prev(); });

    // ===== Modal: abrir/fechar e navegar entre múltiplos iframes da página =====
    let modalIndexSel = 0;
    let modalPageConfigs = [];

    function openModalForCurrentPage() {
      modalPageConfigs = IFRAMES.filter(item => item.pagina === (index + 1));
      if (modalPageConfigs.length === 0) return;
      modalIndexSel = 0;
      setModalContent();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function setModalContent() {
      const cfg = modalPageConfigs[modalIndexSel];
      if (!cfg) return;
      // define SRC só agora, sem alterar o overlay existente
      if (!userActivated) onUserGesture(); // garante gesto/perm.
      modalIframe.src = cfg.link;
      modalCounter.textContent = `${modalIndexSel + 1}/${modalPageConfigs.length}`;
      modalNav.style.display = modalPageConfigs.length > 1 ? 'flex' : 'none';
    }

    openFullBtn.addEventListener('click', openModalForCurrentPage);
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    modalPrev.addEventListener('click', () => { if (modalPageConfigs.length < 2) return; modalIndexSel = (modalIndexSel - 1 + modalPageConfigs.length) % modalPageConfigs.length; setModalContent(); });
    modalNext.addEventListener('click', () => { if (modalPageConfigs.length < 2) return; modalIndexSel = (modalIndexSel + 1) % modalPageConfigs.length; setModalContent(); });

    // Responsividade
    window.addEventListener('resize', resizeViewer);
    window.addEventListener('orientationchange', resizeViewer);
    window.addEventListener('load', () => { resizeViewer(); render(); });

    // fallback imediato (antes do load)
    resizeViewer();
    render();
  </script>
</body>
</html>
